<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Internet Connection — LINKod</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f4f8;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .card {
            background: #ffffff;
            border-radius: 1.25rem;
            box-shadow: 0 10px 25px -5px rgba(0, 51, 160, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
            max-width: 440px;
            width: 100%;
            padding: 2.5rem 2rem;
            text-align: center;
        }
        .logo-wrap {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
        }
        .logo-wrap img {
            height: 48px;
            width: auto;
        }
        .icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: #fee2e2;
            color: #ef4444;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
        }
        h1 {
            font-size: 1.35rem;
            font-weight: 800;
            color: #0033a0;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 0.9rem;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 1.75rem;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 1.25rem;
            border-radius: 0.65rem;
            font-size: 0.875rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-primary {
            background-color: #0033a0;
            color: #ffffff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #002270;
        }
        .btn-secondary {
            background-color: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
        }
        .btn-secondary:hover {
            background-color: #e2e8f0;
        }
        .notice {
            margin-top: 1.5rem;
            padding: 0.75rem;
            background-color: #eff6ff;
            border: 1px dashed #93c5fd;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            color: #1e40af;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <img src="/images/LINKOD logo.png" alt="LINKod Logo">
        </div>
        <div class="icon-circle">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>
        <h1>No Internet Connection</h1>
        <p>This page requires an active connection. You can continue viewing and updating your assigned tasks offline.</p>
        <div class="actions">
            <a href="/worker/job-orders" class="btn btn-primary">Open Job Orders</a>
            <a href="/worker/dashboard" class="btn btn-secondary">Go to Worker Dashboard</a>
            <button onclick="window.location.reload()" class="btn btn-secondary">Try Reconnecting</button>
        </div>
        <div class="notice">
            💡 <strong>Offline Mode:</strong> Task updates and photos taken offline are saved and will auto-sync when online.
        </div>
    </div>
</body>
</html>
